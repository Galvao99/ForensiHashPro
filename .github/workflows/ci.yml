name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: forensihash_test
          POSTGRES_USER: forensihash
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forensihash -d forensihash_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FORENSIHASH_DATABASE_URL: postgresql+psycopg://forensihash:ci_password@localhost:5432/forensihash_test
      FORENSIHASH_TEST_DATABASE_URL: postgresql+psycopg://forensihash:ci_password@localhost:5432/forensihash_test
      FORENSIHASH_SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      FORENSIHASH_COOKIE_SECURE: "false"
      IP2LOCATION_ENABLED: "false"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Confirm Python version
        run: python --version

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Confirm current migration
        run: python -m alembic current

      - name: Compile Python sources
        run: python -m compileall -q app web

      # The legacy desktop tree has known Ruff debt; the web backend is the
      # currently enforced, clean Python lint scope.
      - name: Lint web backend
        run: python -m ruff check web/backend

      - name: Verify Qt headless application
        run: python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); assert app.platformName() == 'offscreen'; app.quit()"

      - name: Run backend, core, and desktop tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend / Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker / Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
