name: Publish staging image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: staging-image-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: GHCR / Publish Staging Image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Define lowercase image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/forensihashpro-api" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=staging
            type=raw,value=${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ github.event.workflow_run.head_sha }}

      - name: Build and publish runtime image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add publication summary
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.metadata.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## ForensiHash API image published"
            echo
            echo "**Registry:** \`ghcr.io\`"
            echo
            echo "**Image:** \`${IMAGE}\`"
            echo
            echo "**Tags:**"
            while IFS= read -r tag; do
              echo "- \`${tag}\`"
            done <<< "$TAGS"
            echo
            echo "**Digest:** \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
