services:
  forensihash-api:
    build:
      context: .
      target: runtime
    image: forensihash-api:local
    environment:
      FORENSIHASH_TEMP_DIR: /tmp/forensihash
      FORENSIHASH_DATABASE_URL: postgresql+psycopg://forensihash:${POSTGRES_PASSWORD:-local-only}@postgres:5432/forensihash
      FORENSIHASH_SESSION_SECRET: ${FORENSIHASH_SESSION_SECRET:-development-only-change-before-production}
      FORENSIHASH_JOB_WORKER_ENABLED: "true"
      FORENSIHASH_ANALYSIS_CONCURRENCY: ${FORENSIHASH_ANALYSIS_CONCURRENCY:-1}
      FORENSIHASH_ANALYSIS_QUEUE_CAPACITY: ${FORENSIHASH_ANALYSIS_QUEUE_CAPACITY:-20}
      FORENSIHASH_ANALYSIS_TIMEOUT_SECONDS: ${FORENSIHASH_ANALYSIS_TIMEOUT_SECONDS:-300}
      FORENSIHASH_ARCHIVE_MAX_ENTRIES: ${FORENSIHASH_ARCHIVE_MAX_ENTRIES:-1000}
      FORENSIHASH_ARCHIVE_MAX_TOTAL_UNCOMPRESSED_BYTES: ${FORENSIHASH_ARCHIVE_MAX_TOTAL_UNCOMPRESSED_BYTES:-1073741824}
      FORENSIHASH_ARCHIVE_MAX_ENTRY_UNCOMPRESSED_BYTES: ${FORENSIHASH_ARCHIVE_MAX_ENTRY_UNCOMPRESSED_BYTES:-268435456}
      FORENSIHASH_ARCHIVE_MAX_COMPRESSION_RATIO: ${FORENSIHASH_ARCHIVE_MAX_COMPRESSION_RATIO:-200}
      FORENSIHASH_ARCHIVE_MAX_NESTING_DEPTH: ${FORENSIHASH_ARCHIVE_MAX_NESTING_DEPTH:-3}
      FORENSIHASH_ARCHIVE_INSPECTION_TIMEOUT_SECONDS: ${FORENSIHASH_ARCHIVE_INSPECTION_TIMEOUT_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python -m alembic upgrade head && python -m uvicorn web.backend.app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: forensihash
      POSTGRES_USER: forensihash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensihash -d forensihash"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - forensihash-postgres:/var/lib/postgresql/data

volumes:
  forensihash-postgres:
