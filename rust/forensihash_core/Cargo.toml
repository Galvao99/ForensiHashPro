[package]
name = "forensihash_core"
version = "0.1.0"
edition = "2021"
description = "Núcleo de alto desempenho do ForensiHash Pro"

[lib]
name = "forensihash_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.44"
png = "0.18"
