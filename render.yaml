services:

  - type: web
    runtime: docker
    name: forensihash-staging-api
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass

    envVars:
      - key: FORENSIHASH_ENV
        value: staging

      - key: FORENSIHASH_DATABASE_URL
        fromDatabase:
          name: forensihash-staging-db
          property: connectionString

      - key: FORENSIHASH_DATABASE_CONNECT_TIMEOUT
        value: "5"

      - key: FORENSIHASH_SESSION_SECRET
        generateValue: true

      - key: FORENSIHASH_COOKIE_SECURE
        value: "true"

      - key: FORENSIHASH_COOKIE_SAMESITE
        value: none

      - key: FORENSIHASH_ALLOWED_ORIGINS
        sync: false

      - key: FORENSIHASH_REGISTRATION_ENABLED
        value: "false"

      - key: FORENSIHASH_JOB_WORKER_ENABLED
        value: "true"

      - key: FORENSIHASH_ANALYSIS_CONCURRENCY
        value: "1"

      - key: FORENSIHASH_ANALYSIS_QUEUE_CAPACITY
        value: "20"

      - key: FORENSIHASH_ANALYSIS_TIMEOUT_SECONDS
        value: "300"

      - key: FORENSIHASH_ARCHIVE_MAX_ENTRIES
        value: "1000"

      - key: FORENSIHASH_ARCHIVE_MAX_TOTAL_UNCOMPRESSED_BYTES
        value: "1073741824"

      - key: FORENSIHASH_ARCHIVE_MAX_ENTRY_UNCOMPRESSED_BYTES
        value: "268435456"

      - key: FORENSIHASH_ARCHIVE_MAX_COMPRESSION_RATIO
        value: "200"

      - key: FORENSIHASH_ARCHIVE_MAX_NESTING_DEPTH
        value: "3"

      - key: FORENSIHASH_ARCHIVE_INSPECTION_TIMEOUT_SECONDS
        value: "30"

      - key: IP2LOCATION_ENABLED
        value: "false"

      - key: FORENSIHASH_TEMP_DIR
        value: /tmp/forensihash

  - type: web
    runtime: static
    name: forensihash-staging-web
    branch: main
    rootDir: web/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass

    envVars:
      - key: VITE_API_BASE_URL
        sync: false

      - key: VITE_API_TIMEOUT_MS
        value: "15000"

      - key: VITE_ANALYSIS_TIMEOUT_MS
        value: "120000"

      - key: VITE_JOB_UPLOAD_TIMEOUT_MS
        value: "60000"

      - key: VITE_REGISTRATION_ENABLED
        value: "false"

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:

  - name: forensihash-staging-db
    plan: free
    databaseName: forensihash
    user: forensihash
    ipAllowList: []
